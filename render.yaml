# Render Blueprint — no-VM demo deployment (free stack).
#
# Services provided by other free accounts (see docs/free-deploy.md):
#   PostgreSQL + PCAP buckets -> Neon (one account, two products)
#   Redis      -> Upstash     IPSEC_REDIS_URL
#
# Cost: 100% free tier. Render background workers are NOT free, so this
# demo runs the API and a single Celery worker in ONE free web service
# (built from the worker image, the only one containing TShark). Demo
# trade-offs: the service sleeps when idle (queued analyses process when
# it wakes), RAM is shared (one analysis at a time, --pool=solo), and the
# API/worker separation of the production Compose setup is collapsed.
# For production, split the worker out per docker-compose.yml.
# No VM/VPS is used anywhere in this deployment.

envVarGroups:
  - name: ipsec-env
    envVars:
      - key: IPSEC_ENVIRONMENT
        value: production
      - key: IPSEC_DATABASE_URL
        sync: false # from Neon: postgresql+psycopg://... (see guide)
      - key: IPSEC_REDIS_URL
        sync: false # from Upstash: rediss://...
      - key: IPSEC_S3_ENDPOINT_URL
        sync: false # Neon branch storage endpoint: https://br-...storage....neon.tech
      - key: IPSEC_S3_BUCKET
        value: ipsec-captures
      - key: IPSEC_S3_ACCESS_KEY
        sync: false # Neon storage credential token_id (nak_live_...)
      - key: IPSEC_S3_SECRET_KEY
        sync: false # Neon storage credential s3_secret_access_key (nsk_live_...)
      - key: IPSEC_S3_REGION
        sync: false # Neon storage region returned with the endpoint (e.g. ap-southeast-1)
      - key: IPSEC_S3_ADDRESSING_STYLE
        value: path # Neon Object Storage is path-style only
      - key: IPSEC_S3_SSE_ALGORITHM
        value: AES256
      - key: IPSEC_JWT_SIGNING_KEY
        generateValue: true
      # Demo deployment: no login anywhere (API runs as demo admin).
      - key: IPSEC_DEMO_MODE
        value: "true"

services:
  - type: web
    name: ipsec-app
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    # Migrate once at boot, start one small worker, then serve the API.
    # Render injects $PORT. Worker is solo-pool/concurrency-1 to fit the
    # free tier's shared RAM; it processes queued jobs while awake.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      celery -A ipsec_analyzer.workers.celery_app:celery_app worker
      --loglevel=INFO --pool=solo --concurrency=1 &
      exec uvicorn ipsec_analyzer.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - fromGroup: ipsec-env

  # Frontend SPA (nginx) — proxies /api/v1/ to the backend service above.
  - type: web
    name: ipsec-web
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: BACKEND_ORIGIN
        value: https://ipsec-app.onrender.com
