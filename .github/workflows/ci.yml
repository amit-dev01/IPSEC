name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ipsec, POSTGRES_PASSWORD: ipsec, POSTGRES_DB: ipsec_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/ipsec_analyzer
      - run: uv run pytest -q
        env:
          IPSEC_TEST_DATABASE_URL: postgresql+psycopg://ipsec:ipsec@localhost:5432/ipsec_test
      - run: uv run pip-audit
      - name: Build images
        run: |
          docker build -f Dockerfile.api .
          docker build -f Dockerfile.worker .
