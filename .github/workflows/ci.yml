name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ipsec, POSTGRES_PASSWORD: ipsec, POSTGRES_DB: ipsec_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/ipsec_analyzer
      - run: uv run pytest -q
        env:
          IPSEC_TEST_DATABASE_URL: postgresql+psycopg://ipsec:ipsec@localhost:5432/ipsec_test
      - run: uv run pip-audit
      - name: Build images
        run: |
          docker build -f Dockerfile.api .
          docker build -f Dockerfile.worker .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Lockfile integrity (frozen install)
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: OpenAPI schema drift check
        run: |
          pnpm api:generate
          pnpm exec prettier --write src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E (mock API)
        run: pnpm test:e2e
      - name: Build frontend container
        working-directory: .
        run: docker build -f frontend/Dockerfile frontend
