[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ipsec-analyzer"
version = "0.1.0"
description = "Defensive, evidence-based IPsec capture analyzer (authorized captures only)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "reportlab>=4.2",
    "redis>=5.2",
    "scikit-learn>=1.6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
ipsec-admin = "ipsec_analyzer.admin:main"
ipsec-ml = "ipsec_analyzer.ml.training:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ipsec_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S: bandit-style checks; tests may use assert (S101 handled via per-file ignore)
per-file-ignores = { "tests/*" = ["S101"] }

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = "migrations/"
