# Local development only. Versions are tags; digests unverified (no registry access in CI sandbox).
services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: ipsec, POSTGRES_PASSWORD: change-me-local-only, POSTGRES_DB: ipsec }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:8
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest  # pin to a RELEASE tag/digest before any non-local use
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: change-me-local-only, MINIO_ROOT_PASSWORD: change-me-local-only }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes: { pgdata: {}, miniodata: {} }
